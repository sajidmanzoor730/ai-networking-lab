<svg width="700" height="430" viewBox="0 0 700 430" xmlns="http://www.w3.org/2000/svg" font-family="Arial, sans-serif" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M2 1L8 5L2 9" fill="none" stroke="#444" stroke-width="1.5"/>
    </marker>
  </defs>

  <text x="350" y="28" text-anchor="middle" font-size="16" font-weight="bold" fill="#1F4E79">AI Fabric Homelab — Topology</text>

  <!-- Real section -->
  <rect x="30" y="55" width="640" height="190" rx="14" fill="#E1F5EE" stroke="#0F6E56" stroke-width="1"/>
  <text x="50" y="80" font-size="13" font-weight="bold" fill="#085041">REAL — 2 Ubuntu 22.04 VMs, actual Linux networking stack</text>

  <!-- VM1 -->
  <rect x="70" y="100" width="220" height="120" rx="10" fill="#ffffff" stroke="#0F6E56" stroke-width="1"/>
  <text x="180" y="122" text-anchor="middle" font-size="13" font-weight="bold" fill="#222">VM1 (host)</text>
  <text x="180" y="142" text-anchor="middle" font-size="11" fill="#444">bond0 (LACP 802.3ad)</text>
  <text x="180" y="160" text-anchor="middle" font-size="11" fill="#444">bond0.100 (VLAN 100)</text>
  <text x="180" y="178" text-anchor="middle" font-size="11" fill="#444">MTU 9000</text>
  <text x="180" y="196" text-anchor="middle" font-size="11" fill="#444">PFC + ECN enabled</text>

  <!-- VM2 -->
  <rect x="410" y="100" width="220" height="120" rx="10" fill="#ffffff" stroke="#0F6E56" stroke-width="1"/>
  <text x="520" y="122" text-anchor="middle" font-size="13" font-weight="bold" fill="#222">VM2 (peer)</text>
  <text x="520" y="142" text-anchor="middle" font-size="11" fill="#444">bond0 (LACP 802.3ad)</text>
  <text x="520" y="160" text-anchor="middle" font-size="11" fill="#444">bond0.100 (VLAN 100)</text>
  <text x="520" y="178" text-anchor="middle" font-size="11" fill="#444">MTU 9000</text>
  <text x="520" y="196" text-anchor="middle" font-size="11" fill="#444">PFC + ECN enabled</text>

  <!-- Link between VMs -->
  <line x1="290" y1="160" x2="410" y2="160" stroke="#0F6E56" stroke-width="1.5" marker-end="url(#arrow)" marker-start="url(#arrow)"/>
  <text x="350" y="150" text-anchor="middle" font-size="10" fill="#085041">RoCE v2 / UDP 4791</text>

  <!-- Automation note -->
  <rect x="330" y="55" width="60" height="0" fill="none"/>
  <text x="350" y="232" text-anchor="middle" font-size="11" fill="#085041">network_audit.py (SSH) → Prometheus / Grafana  |  vlan_config.sh (provisioning)</text>

  <!-- Simulated section -->
  <rect x="30" y="260" width="640" height="130" rx="14" fill="#FAECE7" stroke="#993C1D" stroke-width="1"/>
  <text x="50" y="285" font-size="13" font-weight="bold" fill="#712B13">SIMULATED — no physical Spectrum switch or ConnectX NICs</text>

  <rect x="70" y="300" width="180" height="70" rx="8" fill="#ffffff" stroke="#993C1D" stroke-width="1"/>
  <text x="160" y="330" text-anchor="middle" font-size="11" font-weight="bold" fill="#222">SONiC NOS</text>
  <text x="160" y="348" text-anchor="middle" font-size="10" fill="#555">config/CLI level only</text>

  <rect x="260" y="300" width="180" height="70" rx="8" fill="#ffffff" stroke="#993C1D" stroke-width="1"/>
  <text x="350" y="330" text-anchor="middle" font-size="11" font-weight="bold" fill="#222">MLAG</text>
  <text x="350" y="348" text-anchor="middle" font-size="10" fill="#555">config logic only</text>

  <rect x="450" y="300" width="180" height="70" rx="8" fill="#ffffff" stroke="#993C1D" stroke-width="1"/>
  <text x="540" y="325" text-anchor="middle" font-size="11" font-weight="bold" fill="#222">ib_write_bw / ibstat</text>
  <text x="540" y="343" text-anchor="middle" font-size="10" fill="#555">no RDMA hw present —</text>
  <text x="540" y="358" text-anchor="middle" font-size="10" fill="#555">correctly reports none</text>

  <text x="350" y="415" text-anchor="middle" font-size="11" fill="#666">Full breakdown: README.md and VALIDATION_OUTPUT.md</text>
</svg>
